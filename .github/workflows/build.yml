name: Build GranularLab APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          echo "=== REPO ROOT ==="
          ls -la
          echo "=== GRADLE / MANIFEST FILES ==="
          find . -maxdepth 5 -type f \( -name "*.gradle" -o -name "AndroidManifest.xml" -o -name "index.html" \) | sort
          MISSING=0
          if [ ! -f settings.gradle ]; then
            echo "::error::В корне нет settings.gradle. Залит только workflow? Загрузи ВСЁ содержимое папки GranularLab (settings.gradle, build.gradle, gradle.properties, app/)."
            MISSING=1
          fi
          if [ ! -f build.gradle ]; then
            echo "::error::В корне нет build.gradle."
            MISSING=1
          fi
          if [ ! -f app/build.gradle ]; then
            echo "::error::Нет app/build.gradle — папка app не загружена."
            MISSING=1
          fi
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::Нет app/src/main/AndroidManifest.xml."
            MISSING=1
          fi
          if [ ! -f app/src/main/assets/ui/index.html ]; then
            echo "::error::Нет app/src/main/assets/ui/index.html — интерфейс не загружен."
            MISSING=1
          fi
          if [ ! -f app/src/main/java/com/granularlab/Engine.java ]; then
            echo "::error::Нет app/src/main/java/com/granularlab/Engine.java — движок не загружен."
            MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then
            echo "::error::Проект загружен не полностью. Скачай ZIP из Forge, распакуй и через Add file -> Upload files перетащи СОДЕРЖИМОЕ папки GranularLab в корень репозитория."
            exit 1
          fi
          echo "OK: структура проекта на месте"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip
          rm ct.zip
          mv cmdline-tools latest
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "=== INSTALLED SDK PACKAGES ==="
          sdkmanager --list_installed

      - name: Install Gradle 7.6.4
        run: |
          set -e
          cd "$HOME"
          curl -fsSL --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
          unzip -q gradle.zip
          rm gradle.zip
          echo "$HOME/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Toolchain info
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GranularLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 
