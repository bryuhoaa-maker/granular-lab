apply plugin: 'com.android.application'

android {
    namespace 'com.granularlab'
    compileSdk 33

    defaultConfig {
        applicationId "com.granularlab"
        minSdk 16
        targetSdk 22
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
